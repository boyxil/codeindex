[package]
name = "codeindex"
version = "0.1.0"
edition = "2021"
description = "Local code index for AI agents — hand-written Rust lexer + item scanner, SQLite storage, MCP-served"
license = "Apache-2.0"
repository = "https://github.com/boyxil/codeindex"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
