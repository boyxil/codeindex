# YantrikDB для codeindex (M5): отдельный инстанс, НЕ память.
# Собственный data_dir, namespace "codeindex", domain "code".
# Обслуживание/консолидация/затухание отключены: индекс кода обязан быть
# детерминированным, memory-lifecycle его портит.
[server]
data_dir = "/var/lib/yantrikdb"

[embedding]
# client_only: векторы приходят от codeindex (Ollama bge-m3, 1024d).
# Инстанс — хранилище, не эмбеддер: качество модели выбирает клиент.
strategy = "client_only"
dim = 1024

[maintenance]
enabled = false

[background]
consolidation_interval_minutes = 5256000
decay_sweep_interval_minutes = 5256000
