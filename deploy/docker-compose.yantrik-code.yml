# codeindex M5 — отдельный YantrikDB для семантики кода.
# НЕ память: собственный data_dir и порт, обслуживание отключено.
# Класть рядом с ./embedder/models и ./data-code в каталоге деплоя
# (сейчас: /media/veracrypt3/Docker/yantrikdb/).
services:
  yantrikdb-code:
    image: localhost/yantrikdb-server:multilingual
    container_name: yantrikdb-code
    restart: on-failure:20
    ports:
      - "127.0.0.1:7442:7438"
    volumes:
      - type: bind
        source: ./data-code
        target: /var/lib/yantrikdb
        bind:
          create_host_path: false
      - type: bind
        source: ./yantrikdb-code.toml
        target: /etc/yantrikdb/yantrikdb.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./embedder/models
        target: /models
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7438/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
